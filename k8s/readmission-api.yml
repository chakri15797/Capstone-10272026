apiVersion: apps/v1
kind: Deployment
metadata:
  name: readmission-risk-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readmission-risk-api
  template:
    metadata:
      labels:
        app: readmission-risk-api
    spec:
      containers:
        - name: readmission-risk-api
          image: readmission-risk-api:auth-20261029-2139
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: readmission-db-credentials
                  key: DATABASE_URL
            - name: APP_DATA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: readmission-db-credentials
                  key: APP_DATA_ENCRYPTION_KEY
            - name: AUTH_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: readmission-db-credentials
                  key: AUTH_BOOTSTRAP_ADMIN_USERNAME
            - name: AUTH_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: readmission-db-credentials
                  key: AUTH_BOOTSTRAP_ADMIN_PASSWORD
            - name: AUTH_COOKIE_SECURE
              value: "true"
            - name: DATA_RETENTION_DAYS
              value: "30"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: readmission-risk-api
spec:
  selector:
    app: readmission-risk-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: LoadBalancer